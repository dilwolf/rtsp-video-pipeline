name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # the reader is a wrapper around ffmpeg, so testing it without ffmpeg
      # would only exercise the parts that were never the risk
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # no torch, no ultralytics: nothing under test needs a model, and pulling
      # them costs minutes per run
      - name: install test deps
        run: pip install numpy pytest

      - name: pytest
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t rtsp-video-pipeline .
